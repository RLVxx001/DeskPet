<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:;" />
  <title>桌宠</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      cursor: default;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #status {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      color: rgba(40, 40, 40, 0.78);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7);
    }
    body.is-ready #status {
      display: none;
    }
    body.is-dragging,
    body.is-hovering {
      cursor: grab;
    }
    body.is-dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="status">正在唤醒…</div>
  <script src="./pet.js"></script>
</body>
</html>
